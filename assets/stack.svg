<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Deleting the meta-logic leaves one language with two calculi" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Deleting the meta-logic leaves one language with two calculi</text>
  <text x="24" y="54" font-size="11.5" fill="#59636e">Left: Isabelle/ZF as written. Right: after isa2fol. ND = natural deduction, LK = sequent calculus</text>

  <rect x="24" y="76" width="296" height="300" rx="8" fill="none" stroke="#8c959f"/>
  <text x="40" y="98" font-weight="600" fill="#1f2328">Isabelle/ZF: four layers</text>

  <rect x="40" y="112" width="264" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="56" y="136" font-weight="600" fill="#1f2328">Tactics</text>
  <text x="56" y="152" font-size="11.5" fill="#59636e">proof automation: blast, simp</text>
  <text x="288" y="136" text-anchor="end" font-size="11.5" fill="#59636e">removed</text>

  <rect x="40" y="176" width="264" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="56" y="200" font-weight="600" fill="#1f2328">ZF</text>
  <text x="56" y="216" font-size="11.5" fill="#59636e">the set theory itself</text>

  <rect x="40" y="240" width="264" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="56" y="264" font-weight="600" fill="#1f2328">FOL</text>
  <text x="56" y="280" font-size="11.5" fill="#59636e">first-order logic underneath ZF</text>

  <rect x="40" y="304" width="264" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="56" y="328" font-weight="600" fill="#1f2328">Meta-logic (Pure)</text>
  <text x="56" y="344" font-size="11.5" fill="#59636e">⋀, ⟹, λ, schematic variables</text>
  <text x="288" y="328" text-anchor="end" font-size="11.5" fill="#59636e">removed</text>

  <path d="M320 226H440" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="380" y="214" text-anchor="middle" font-weight="600" fill="#1f2328">isa2fol</text>
  <text x="380" y="246" text-anchor="middle" font-size="11.5" fill="#59636e">9,404 of 9,420</text>
  <text x="380" y="262" text-anchor="middle" font-size="11.5" fill="#59636e">theorems</text>

  <rect x="440" y="76" width="296" height="300" rx="8" fill="none" stroke="#8c959f"/>
  <text x="456" y="98" font-weight="600" fill="#1f2328">After isa2fol: one logic</text>

  <rect x="456" y="112" width="112" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="472" y="136" font-weight="600" fill="#1f2328">ND</text>
  <text x="472" y="152" font-size="11.5" fill="#59636e">for reading</text>

  <rect x="608" y="112" width="112" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="624" y="136" font-weight="600" fill="#1f2328">LK</text>
  <text x="624" y="152" font-size="11.5" fill="#59636e">for search</text>

  <path d="M568 140H608" fill="none" stroke="#8c959f" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="588" y="196" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">translator</text>
  <text x="588" y="212" text-anchor="middle" font-size="11.5" fill="#59636e">LK ≈ 1.08× ND</text>
  <path d="M512 168V232M664 168V232" fill="none" stroke="#8c959f" stroke-width="1.25"/>

  <rect x="456" y="232" width="264" height="128" rx="8" fill="#0969da" fill-opacity="0.1" stroke="#0969da" stroke-width="2"/>
  <text x="472" y="256" font-weight="600" fill="#1f2328">First-order set theory (NBG)</text>
  <text x="472" y="274" font-size="11.5" fill="#1f2328">3 predicates: ∈, =, is-a-set</text>
  <text x="472" y="290" font-size="11.5" fill="#1f2328">no function symbols</text>
  <text x="472" y="306" font-size="11.5" fill="#1f2328">functions, constants → classes</text>
  <text x="472" y="322" font-size="11.5" fill="#1f2328">19 axioms, nothing else assumed</text>
  <text x="472" y="338" font-size="11.5" fill="#1f2328">one small proof checker</text>
</svg>
